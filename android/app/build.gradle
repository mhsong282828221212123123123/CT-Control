plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tesla.ctcontrol'
    compileSdk 34

    defaultConfig {
        applicationId "com.tesla.ctcontrol"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "12.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
